    <script>
      // Gracefully ignore disabled HMR WebSocket errors as required by runtime environment
      window.addEventListener('error', function (e) {
        var msg = e && (e.message || (e.error && e.error.message) || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('Failed to construct')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason ? (e.reason.message || String(e.reason)) : '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
